{% extends "base.html" %}

{% block title %}Онлайн-запись | Массажная Студия{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto; background: #fff; padding: 2rem; border-radius: var(--border-radius); box-shadow: var(--box-shadow);">
  <h2 style="color: var(--primary-color); margin-bottom: 1.5rem; text-align: center;">Онлайн-запись на сеанс</h2>

  <div id="booking-alert" style="display: none; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem;"></div>

  <form id="booking-form">
    <div class="form-group">
      <label for="client_name">Ваше имя *</label>
      <input type="text" id="client_name" required placeholder="Иван Иванов">
    </div>

    <div class="form-group">
      <label for="client_phone">Телефон *</label>
      <input type="tel" id="client_phone" required placeholder="+7 (999) 000-00-00">
    </div>

    <div class="form-group">
      <label for="client_email">Email (необязательно)</label>
      <input type="email" id="client_email" placeholder="example@mail.ru">
    </div>

    <div class="form-group">
      <label for="service_id">Выберите услугу *</label>
      <select id="service_id" required>
        <option value="">-- Выберите услугу --</option>
        {% for service in services %}
        <option value="{{ service.id }}">{{ service.title }} ({{ service.price }} ₽, {{ service.duration_minutes }} мин)</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label for="master_id">Мастер (необязательно)</label>
      <select id="master_id">
        <option value="">-- Любой свободный мастер --</option>
        {% for master in masters %}
        <option value="{{ master.id }}">{{ master.name }} ({{ master.specialization }})</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label for="booking_date">Дата и время записи *</label>
      <input type="datetime-local" id="booking_date" required>
    </div>

    <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Подтвердить запись</button>
  </form>
</div>
{% endblock %}
