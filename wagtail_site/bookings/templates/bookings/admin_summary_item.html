{% load wagtailadmin_tags %}
<li class="c-summary__item">
    <a href="{{ url }}" class="c-summary__link" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; text-decoration: none; border-radius: 8px; background: #fafafa; border: 1px solid #e5e7eb; transition: all 0.2s ease;">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div style="width: 38px; height: 38px; border-radius: 8px; background: #e0f2fe; color: #0284c7; display: flex; align-items: center; justify-content: center; font-size: 1.25rem;">
                📅
            </div>
            <div>
                <strong style="display: block; font-size: 0.95rem; color: #1f2937;">Записи клиентов</strong>
                <span style="font-size: 0.8rem; color: #6b7280;">Всего: <strong>{{ total_bookings }}</strong> {% if pending_bookings > 0 %}• <span style="color: #d97706; font-weight: 600;">{{ pending_bookings }} ожидает подтверждения</span>{% endif %}</span>
            </div>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
            <span class="c-summary__value" style="font-size: 1.25rem; font-weight: 700; color: #111827;">{{ total_bookings }}</span>
        </div>
    </a>
</li>
